<style>
:root {
  --bg: #1b1830; --bg2: #231f3d; --panel: #2b2649; --panel2: #332d57;
  --ink: #ede6d6; --muted: #aaa3c2; --line: #4a4370;
  --gold: #f2c14e; --gold-ink: #1b1830; --gold-soft: rgba(242, 193, 78, .12);
  --teal: #4fd1c5; --teal-soft: rgba(79, 209, 197, .13);
  --rose: #ef5d84; --rose-soft: rgba(239, 93, 132, .14);
  --sky: #8ab4ff; --sky-soft: rgba(138, 180, 255, .12);
  --paper: #242040; --key: #342e58; --key-hi: #413a6c;
  --display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ebe8f3; --bg2: #e1ddee; --panel: #ffffff; --panel2: #f4f2fa;
    --ink: #221d3a; --muted: #5d5779; --line: #c6c0da;
    --gold: #8a5a00; --gold-ink: #fff8e6; --gold-soft: rgba(176, 120, 0, .1);
    --teal: #0b7a70; --teal-soft: rgba(11, 122, 112, .1);
    --rose: #b8284f; --rose-soft: rgba(184, 40, 79, .09);
    --sky: #2f5fc4; --sky-soft: rgba(47, 95, 196, .09);
    --paper: #fbfaff; --key: #ffffff; --key-hi: #ece9f6;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ebe8f3; --bg2: #e1ddee; --panel: #ffffff; --panel2: #f4f2fa;
  --ink: #221d3a; --muted: #5d5779; --line: #c6c0da;
  --gold: #8a5a00; --gold-ink: #fff8e6; --gold-soft: rgba(176, 120, 0, .1);
  --teal: #0b7a70; --teal-soft: rgba(11, 122, 112, .1);
  --rose: #b8284f; --rose-soft: rgba(184, 40, 79, .09);
  --sky: #2f5fc4; --sky-soft: rgba(47, 95, 196, .09);
  --paper: #fbfaff; --key: #ffffff; --key-hi: #ece9f6;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding: 96px 0 300px; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }

.wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 24px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: .01em; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* ---------- System message: the signature element ---------- */
.sys {
  position: relative; margin: 12px 0;
  padding: 12px 14px 12px 16px;
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, var(--gold-soft) 3px 4px),
    var(--panel);
  border: 2px solid var(--gold);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.sys::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--gold);
}
.sys-title { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 19px; margin-bottom: 4px; }
.sys p { margin: 0; }
.sys.alert { border-color: var(--rose); }
.sys.alert::before { background: var(--rose); }
.sys.alert .sys-title { color: var(--rose); }

.say { display: flex; gap: 8px; align-items: baseline; margin: 6px 2px 10px; font-size: 15px; }
.say b { font-family: var(--display); font-weight: 600; color: var(--sky); white-space: nowrap; }
.say span { color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 46px; padding: 10px 16px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--panel2); font-weight: 700;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-family: var(--display); font-size: 18px; }
.btn.teal { background: var(--teal); border-color: var(--teal); color: var(--gold-ink); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; }

/* ---------- create + hub ---------- */
.title-card { padding: 22px 4px 6px; }
.title-card h1 { font-size: 34px; }
.field { display: block; margin: 14px 0; }
.field > span { display: block; font-weight: 700; margin-bottom: 6px; }
.text-in {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--paper);
}
.classes { display: grid; gap: 8px; }
.class-opt {
  text-align: left; padding: 12px 14px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--panel);
}
.class-opt strong { font-family: var(--display); font-size: 18px; display: block; }
.class-opt[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }

.crawler-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding-top: 8px; }
.crawler-head .lvl { font-family: var(--display); font-size: 42px; font-weight: 700; color: var(--gold); line-height: 1; }
.bar { height: 10px; border-radius: 6px; background: var(--bg2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--gold); transition: width .4s ease; }
.bar.hp > i { background: var(--teal); }
.bar.hp.low > i { background: var(--rose); }
.stat-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 4px; }

.floor-card {
  margin: 14px 0 10px; padding: 16px; border-radius: 14px;
  background: var(--panel); border: 2px solid var(--line);
}
.floor-card.locked { opacity: .55; border-style: dashed; }
.floor-card h2 { margin-bottom: 2px; }
.floor-card .btn { margin-top: 12px; }
.hub-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

/* ---------- run HUD ---------- */
.hud {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg); padding: 10px 14px 8px; border-bottom: 1px solid var(--line);
}
.hud-in { max-width: 520px; margin: 0 auto; }
.hud-row { display: flex; align-items: center; gap: 10px; }
.hud .hpwrap { flex: 1; }
.hud .hpnum { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.hud .timer { font-family: var(--display); font-weight: 700; font-size: 22px; min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
.hud .timer.warn { color: var(--rose); }
.hud .fans { font-size: 13px; color: var(--muted); text-align: right; min-width: 64px; }
.hud .fans b { display: block; color: var(--ink); font-size: 16px; }
.hud-row2 { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
.pips { display: flex; gap: 5px; align-items: center; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.pip.done { background: var(--teal); border-color: var(--teal); }
.pip.now { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.pip.side { border-radius: 3px; transform: rotate(45deg) scale(.85); }
.pip.boss { width: 18px; height: 18px; border-radius: 4px; }
.pip.skip { opacity: .3; }
.bag { display: flex; gap: 5px; }
.bag button {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 3px 9px; font-size: 13px; min-height: 30px;
}
.quit { font-size: 13px; }

.boss-bar { margin: 8px 0 2px; }
.boss-bar .stat-line { color: var(--rose); font-weight: 700; }
.boss-bar .bar > i { background: var(--rose); }
.shake { animation: shake .35s ease; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

/* ---------- work board (mirrors the center-line method on paper) ---------- */
.board {
  background: var(--paper); border: 2px solid var(--line); border-radius: 14px;
  padding: 10px 8px 12px; margin-top: 6px;
}
.row { display: grid; grid-template-columns: 1fr 26px 1fr; align-items: center; }
.row > .l { text-align: right; padding-right: 8px; }
.row > .r { text-align: left; padding-left: 8px; }
.row > .mid { align-self: stretch; display: flex; justify-content: center; align-items: center; position: relative; }
.row > .mid::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--line); }
.row > .mid b { position: relative; background: var(--paper); font-size: 20px; line-height: 1; padding: 2px 0; font-weight: 400; }
.eqrow { min-height: 44px; font-size: 21px; }
.eqrow.start { font-size: 22px; padding-bottom: 6px; border-bottom: 2px dashed var(--line); margin-bottom: 4px; }
.oprow { font-size: 16px; color: var(--sky); min-height: 30px; }
.oprow .l, .oprow .r { border-bottom: 2px solid var(--sky); padding-bottom: 2px; }
.oprow.empty .l, .oprow.empty .r { border-bottom: 0; }
.eqrow.final .l, .eqrow.final .r { color: var(--teal); font-weight: 700; }

.entry { margin-top: 6px; }
.entry .row { margin: 4px 0; }
.cell {
  width: 100%; min-height: 46px; border-radius: 9px; padding: 8px 10px;
  border: 2px solid var(--line); background: var(--bg2);
  font-size: 19px; font-variant-numeric: tabular-nums;
}
.cell::placeholder { color: var(--muted); opacity: .75; font-size: 14px; }
.cell.op { min-height: 40px; font-size: 16px; color: var(--sky); border-style: dashed; }
.cell.active { border-color: var(--gold); background: var(--panel); }
.cell.bad { border-color: var(--rose); }
.row .l .cell { text-align: right; }
.preview { min-height: 34px; margin: 6px 4px 0; font-size: 15px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.preview .m { color: var(--ink); font-size: 19px; }

.actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-top: 10px; }
.actions .wide { grid-column: 1 / -1; }
.declare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.declare .btn { min-height: 40px; font-size: 14px; padding: 6px 8px; border-style: dashed; }

.fb { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border-left: 5px solid var(--line); background: var(--panel); font-size: 15.5px; }
.fb:empty { display: none; }
.fb.ok { border-color: var(--teal); background: var(--teal-soft); }
.fb.bad { border-color: var(--rose); background: var(--rose-soft); }
.fb.hint { border-color: var(--sky); background: var(--sky-soft); }
.fb.info { border-color: var(--gold); background: var(--gold-soft); }
.fb .who { font-family: var(--display); font-weight: 700; }
.fb p { margin: 0 0 4px; }
.fb p:last-child { margin: 0; }

/* math rendering */
.m { white-space: nowrap; display: inline-flex; align-items: center; flex-wrap: nowrap; }
.m i { font-family: "Times New Roman", Georgia, serif; font-size: 1.12em; padding: 0 1px; }
.m .bin { padding: 0 .28em; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .78em; margin: 0 2px; line-height: 1.05; }
.fr > span { padding: 0 2px; }
.fr > .fn { border-bottom: 1.5px solid currentColor; }
.mp { font-size: 1.15em; padding: 0 1px; }

/* ---------- keypad ---------- */
.pad {
  position: sticky; bottom: 0; z-index: 6;
  background: var(--bg2); border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
}
.pad-grid { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.key {
  min-height: 46px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--key); font-size: 21px; font-weight: 700;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.key:active { background: var(--key-hi); }
.key.fn { font-size: 15px; font-weight: 700; color: var(--muted); }
.key.var { font-family: "Times New Roman", Georgia, serif; font-style: italic; color: var(--gold); font-size: 25px; }
.key.opk { color: var(--sky); }
.key.go { grid-column: span 2; background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-family: var(--display); font-size: 17px; }
.key .fr { font-size: 14px; }

/* ---------- modal + toasts ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10, 8, 22, .72); display: flex; align-items: flex-end; justify-content: center; }
.modal-card {
  width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
  background: var(--bg); border-top: 3px solid var(--gold); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  animation: rise .22s ease;
}
@media (min-width: 560px) { .modal { align-items: center; } .modal-card { border-radius: 18px; border: 3px solid var(--gold); } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.modal-card .btn + .btn { margin-top: 8px; }

.loot-box {
  margin: 18px auto 10px; width: 150px; height: 150px; display: grid; place-items: center;
  border-radius: 18px; border: 4px solid currentColor; font-family: var(--display);
  font-size: 22px; font-weight: 700; text-align: center; padding: 10px; background: var(--panel);
}
.loot-box.closed { animation: wobble 1.1s ease-in-out infinite; cursor: pointer; }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.loot-box.pop { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.12); } }
.t-bronze { color: #c98a55; } .t-silver { color: #b9c3d6; } .t-gold { color: var(--gold); } .t-legendary { color: #d38bff; }
:root[data-theme="light"] .t-silver { color: #6b7a93; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .t-silver { color: #6b7a93; } :root:not([data-theme="dark"]) .t-bronze { color: #9a5a22; } :root:not([data-theme="dark"]) .t-legendary { color: #8a2fc2; } }
.item { padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 2px solid var(--line); margin: 8px 0; }
.item h3 { margin-bottom: 2px; }
.item .tier { font-size: 13px; font-weight: 700; }

.toasts { position: fixed; top: 10px; left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 10px; }
.toast {
  max-width: 480px; width: 100%; background: var(--panel); border: 2px solid var(--gold);
  border-radius: 12px; padding: 10px 14px; animation: drop .25s ease; box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
.toast b { font-family: var(--display); color: var(--gold); display: block; }
@keyframes drop { from { transform: translateY(-16px); opacity: 0; } }

.worked { margin: 10px 0; }
.worked .why { font-size: 14px; color: var(--muted); margin: 8px 0 2px; }
.worked .board { margin-top: 4px; }

/* lists / tabs / parent */
.tabs { display: flex; gap: 6px; margin: 12px 0; }
.tabs button { flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); font-weight: 700; }
.tabs button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
.ach { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ach .mark { width: 26px; height: 26px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; }
.ach.got .mark { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.ach:not(.got) { opacity: .55; }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.kv div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.kv b { display: block; font-family: var(--display); font-size: 24px; }
.kv span { font-size: 13px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle input { width: 24px; height: 24px; accent-color: var(--gold); }
.section { margin-top: 22px; }
textarea.text-in { min-height: 90px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 40px; min-height: 40px; border-radius: 9px; border: 2px solid var(--line); background: var(--panel); font-family: "Times New Roman", Georgia, serif; font-style: italic; font-size: 20px; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.logrow { padding: 10px 0; border-bottom: 1px solid var(--line); }
.logeq { font-size: 18px; overflow-x: auto; padding-bottom: 2px; }
.toast span { display: block; font-size: 14px; }

<body>
<div id="app">
  <section id="scr-create" class="wrap" hidden></section>
  <section id="scr-hub" class="wrap" hidden></section>
  <section id="scr-run" hidden>
    <header class="hud" id="hud"></header>
    <div class="wrap" id="run-body"></div>
  </section>
  <section id="scr-hwin" class="wrap" hidden></section>
  <section id="scr-recap" class="wrap" hidden></section>
  <section id="scr-bag" class="wrap" hidden></section>
  <section id="scr-parent" class="wrap" hidden></section>
  <footer class="pad" id="pad" hidden><div class="pad-grid"></div></footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<noscript><p style="padding:20px">This game needs JavaScript turned on.</p></noscript>
<script>
/* ============================================================
   MATH ENGINE — exact fractions, parsing, step checking,
   mistake detection, hints, worked-example solver, generators.
   Skill packs register here so new units can be added later.
   ============================================================ */
const Engine = (() => {

class MathErr extends Error {}

// ---------- exact fractions ----------
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const lcm = (a, b) => (a / gcd(a, b)) * b;
class Q {
  constructor(n, d = 1) {
    if (d === 0) throw new MathErr("You can't divide by zero. Not even in the dungeon.");
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    this.n = n / g + 0; this.d = d / g;
    if (!Number.isSafeInteger(this.n) || !Number.isSafeInteger(this.d)) throw new MathErr('Those numbers got too big.');
  }
  add(o) { return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Q(this.n * o.n, this.d * o.d); }
  div(o) { if (o.n === 0) throw new MathErr("You can't divide by zero. Not even in the dungeon."); return new Q(this.n * o.d, this.d * o.n); }
  neg() { return new Q(-this.n, this.d); }
  abs() { return new Q(Math.abs(this.n), this.d); }
  isZero() { return this.n === 0; }
  isInt() { return this.d === 1; }
  eq(o) { return this.n === o.n && this.d === o.d; }
  cmp(o) { return this.n * o.d - o.n * this.d; }
  sign() { return Math.sign(this.n); }
  toString() { return this.d === 1 ? String(this.n) : this.n + '/' + this.d; }
}
const Q0 = new Q(0), Q1 = new Q(1), QM1 = new Q(-1);
const q = (n, d = 1) => new Q(n, d);

function parseDec(t) {
  if (!t.includes('.')) return new Q(parseInt(t, 10));
  const [a, b = ''] = t.split('.');
  const den = Math.pow(10, b.length);
  return new Q(parseInt((a || '0') + b, 10), den);
}

// ---------- linear expressions {v:{name:Q}, k:Q} ----------
const Lin = {
  c: (x) => ({ v: {}, k: x }),
  x: (name, co = Q1) => (co.isZero() ? { v: {}, k: Q0 } : { v: { [name]: co }, k: Q0 }),
  add(a, b) {
    const v = { ...a.v };
    for (const n in b.v) { const s = v[n] ? v[n].add(b.v[n]) : b.v[n]; if (s.isZero()) delete v[n]; else v[n] = s; }
    return { v, k: a.k.add(b.k) };
  },
  scale(a, f) {
    if (f.isZero()) return { v: {}, k: Q0 };
    const v = {}; for (const n in a.v) v[n] = a.v[n].mul(f);
    return { v, k: a.k.mul(f) };
  },
  neg: (a) => Lin.scale(a, QM1),
  sub: (a, b) => Lin.add(a, Lin.neg(b)),
  isConst: (a) => Object.keys(a.v).length === 0,
  coef: (a, n) => a.v[n] || Q0,
  vars: (a) => Object.keys(a.v),
  eq(a, b) {
    if (!a.k.eq(b.k)) return false;
    const ka = Object.keys(a.v), kb = Object.keys(b.v);
    return ka.length === kb.length && ka.every((n) => b.v[n] && b.v[n].eq(a.v[n]));
  },
  varPart: (a) => ({ v: { ...a.v }, k: Q0 }),
  constPart: (a) => ({ v: {}, k: a.k }),
  sum: (list) => list.reduce((s, t) => Lin.add(s, t), Lin.c(Q0)),
  dens(a) { const d = [a.k.d]; for (const n in a.v) d.push(a.v[n].d); return d; },
};

// ---------- tokenizer + parser ----------
function normalize(s) {
  return String(s).replace(/[−–—]/g, '-').replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/[\[{]/g, '(').replace(/[\]}]/g, ')');
}
function tokenize(str) {
  const s = normalize(str).replace(/\s+/g, '');
  const toks = []; let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/[0-9.]/.test(ch)) {
      let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
      const t = s.slice(i, j);
      if (!/^(\d+(\.\d*)?|\.\d+)$/.test(t)) throw new MathErr(`"${t}" isn't a number the System recognizes.`);
      toks.push({ t: 'num', v: parseDec(t), raw: t }); i = j;
    } else if (/[a-zA-Z]/.test(ch)) { toks.push({ t: 'var', v: ch.toLowerCase() }); i++; }
    else if ('+-*/()'.includes(ch)) { toks.push({ t: ch }); i++; }
    else if (ch === '=') throw new MathErr('Each box holds one side. Leave the = sign out.');
    else throw new MathErr(`The System doesn't understand "${ch}".`);
  }
  return toks;
}
function parseExpr(str) {
  const toks = tokenize(str);
  if (!toks.length) throw new MathErr('This box is empty.');
  let p = 0;
  const peek = () => toks[p];
  const next = () => toks[p++];
  const sym = (t) => (t.t === 'num' ? t.raw : t.t === 'var' ? t.v : t.t);
  function expr() {
    let node = term();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = next().t; const r = term();
      node = { t: op === '+' ? 'add' : 'sub', a: node, b: r };
    }
    return node;
  }
  function term() {
    let node = unary();
    while (peek()) {
      const t = peek().t;
      if (t === '*' || t === '/') { next(); node = { t: t === '*' ? 'mul' : 'div', a: node, b: unary(), explicit: true }; }
      else if (t === 'num' || t === 'var' || t === '(') node = { t: 'mul', a: node, b: primary() };
      else break;
    }
    return node;
  }
  function unary() {
    const t = peek();
    if (!t) throw new MathErr('Something is missing at the end.');
    if (t.t === '-') { next(); return { t: 'neg', a: unary() }; }
    if (t.t === '+') { next(); return unary(); }
    return primary();
  }
  function primary() {
    const t = next();
    if (!t) throw new MathErr('Something is missing at the end.');
    if (t.t === 'num') return { t: 'num', v: t.v, raw: t.raw };
    if (t.t === 'var') return { t: 'var', n: t.v };
    if (t.t === '(') {
      if (peek() && peek().t === ')') throw new MathErr('Empty parentheses ( ) — something goes inside.');
      const e = expr(); const c = next();
      if (!c || c.t !== ')') throw new MathErr('Missing a closing parenthesis ).');
      return { t: 'grp', a: e };
    }
    throw new MathErr(`"${sym(t)}" is in a weird spot.`);
  }
  const tree = expr();
  if (p < toks.length) throw new MathErr(`"${sym(toks[p])}" is in a weird spot.`);
  return tree;
}

// ---------- evaluation (normal + faulty "common mistake" modes) ----------
function flatTerms(n, mode) {
  if (n.t === 'add') return [...flatTerms(n.a, mode), ...flatTerms(n.b, mode)];
  if (n.t === 'sub') return [...flatTerms(n.a, mode), ...flatTerms(n.b, mode).map(Lin.neg)];
  return [eva(n, mode)];
}
function negFirstOnly(g, mode) {
  const t = flatTerms(g.a, mode);
  return Lin.sum([Lin.neg(t[0]), ...t.slice(1)]);
}
function eva(n, mode = null) {
  switch (n.t) {
    case 'num': return Lin.c(n.v);
    case 'var': return Lin.x(n.n);
    case 'grp': return eva(n.a, mode);
    case 'neg':
      if (mode === 'minusFirst' && n.a.t === 'grp') return negFirstOnly(n.a, mode);
      return Lin.neg(eva(n.a, mode));
    case 'add': return Lin.add(eva(n.a, mode), eva(n.b, mode));
    case 'sub':
      if (mode === 'minusFirst' && n.b.t === 'grp') return Lin.add(eva(n.a, mode), negFirstOnly(n.b, mode));
      return Lin.sub(eva(n.a, mode), eva(n.b, mode));
    case 'mul': {
      const A = eva(n.a, mode), B = eva(n.b, mode);
      if (!Lin.isConst(A) && !Lin.isConst(B)) throw new MathErr('This floor only has straight-line equations — no variable times variable.');
      if (mode === 'firstOnly' || mode === 'signSlip') {
        const g = n.b.t === 'grp' ? n.b : n.a.t === 'grp' ? n.a : null;
        const other = g === n.b ? A : B;
        if (g && Lin.isConst(other)) {
          const k = other.k; const terms = flatTerms(g.a, mode);
          if (terms.length > 1 && !(mode === 'signSlip' && k.sign() >= 0)) {
            const k2 = mode === 'firstOnly' ? Q1 : k.abs();
            return Lin.sum([Lin.scale(terms[0], k), ...terms.slice(1).map((t) => Lin.scale(t, k2))]);
          }
        }
      }
      return Lin.isConst(A) ? Lin.scale(B, A.k) : Lin.scale(A, B.k);
    }
    case 'div': {
      const A = eva(n.a, mode), B = eva(n.b, mode);
      if (!Lin.isConst(B)) throw new MathErr("You can't divide by a variable on this floor.");
      if (B.k.isZero()) throw new MathErr("You can't divide by zero. Not even in the dungeon.");
      return Lin.scale(A, Q1.div(B.k));
    }
  }
  throw new MathErr('Unknown expression.');
}

// expand parentheses but keep terms separate (for worked examples)
function expandTerms(n) {
  switch (n.t) {
    case 'num': return [Lin.c(n.v)];
    case 'var': return [Lin.x(n.n)];
    case 'grp': return expandTerms(n.a);
    case 'neg': return expandTerms(n.a).map(Lin.neg);
    case 'add': return [...expandTerms(n.a), ...expandTerms(n.b)];
    case 'sub': return [...expandTerms(n.a), ...expandTerms(n.b).map(Lin.neg)];
    case 'mul': {
      const A = expandTerms(n.a), B = expandTerms(n.b);
      const Av = Lin.sum(A), Bv = Lin.sum(B);
      if (Lin.isConst(Av)) return B.map((t) => Lin.scale(t, Av.k));
      if (Lin.isConst(Bv)) return A.map((t) => Lin.scale(t, Bv.k));
      throw new MathErr('nonlinear');
    }
    case 'div': { const Bv = eva(n.b); return expandTerms(n.a).map((t) => Lin.scale(t, Q1.div(Bv.k))); }
  }
  return [];
}

// ---------- AST inspection ----------
const hasGrp = (n) => !!n && (n.t === 'grp' || ['add', 'sub', 'mul', 'div'].includes(n.t) && (hasGrp(n.a) || hasGrp(n.b)) || n.t === 'neg' && hasGrp(n.a));
function grpMultiplier(n) { // describe first distribution found
  if (!n) return null;
  if (n.t === 'mul') {
    const g = n.b.t === 'grp' ? n.b : n.a.t === 'grp' ? n.a : null;
    if (g) { const o = g === n.b ? n.a : n.b; try { const v = eva(o); if (Lin.isConst(v)) return fmtQ(v.k); } catch (e) {} }
  }
  if (n.t === 'sub' && n.b.t === 'grp') return 'minus';
  if (n.t === 'neg' && n.a.t === 'grp') return 'minus';
  for (const c of [n.a, n.b]) if (c && typeof c === 'object') { const r = grpMultiplier(c); if (r) return r; }
  return null;
}
function needsCombine(n) {
  if (hasGrp(n)) return false;
  const terms = flatTerms(n);
  let consts = 0; const vars = {};
  for (const t of terms) {
    if (Lin.isConst(t)) consts++;
    else for (const k of Lin.vars(t)) vars[k] = (vars[k] || 0) + 1;
    if (Lin.vars(t).length > 1) return true;
  }
  return consts > 1 || Object.values(vars).some((c) => c > 1);
}
function varsIn(n, set = new Set()) {
  if (!n) return set;
  if (n.t === 'var') set.add(n.n);
  if (n.a) varsIn(n.a, set); if (n.b) varsIn(n.b, set);
  return set;
}
const hasFracCoef = (lin) => Lin.dens(lin).some((d) => d > 1);

// ---------- formatting ----------
const fmtQ = (x) => x.toString();
function fmtTermLin(t, first) {
  const names = Lin.vars(t);
  let c, body;
  if (names.length) { c = t.v[names[0]]; body = names[0]; } else { c = t.k; body = ''; }
  const negative = c.sign() < 0; const a = c.abs();
  let s;
  if (body) s = (a.eq(Q1) ? '' : fmtQ(a)) + body; else s = fmtQ(a);
  if (first) return (negative ? '-' : '') + s;
  return (negative ? ' - ' : ' + ') + s;
}
function fmtTerms(list) {
  const nz = list.filter((t) => !(Lin.isConst(t) && t.k.isZero()));
  if (!nz.length) return '0';
  return nz.map((t, i) => fmtTermLin(t, i === 0)).join('');
}
function splitLin(lin, order = 'varFirst') {
  const parts = [];
  for (const n of Lin.vars(lin)) parts.push(Lin.x(n, lin.v[n]));
  const c = Lin.c(lin.k);
  if (order === 'constFirst') parts.unshift(c); else parts.push(c);
  return parts;
}
const fmtLin = (lin, order) => fmtTerms(splitLin(lin, order));
function fmtAddend(lin) { // "+ 4n" / "- 5"
  const s = fmtTerms(splitLin(lin));
  return s.startsWith('-') ? '− ' + s.slice(1).replace(/ - /g, ' − ') : '+ ' + s.replace(/ - /g, ' − ');
}
const pretty = (s) => s.replace(/-/g, '−');

// ---------- operations under each side ----------
function parseOp(raw) {
  const r = String(raw || '').trim();
  if (!r) return null;
  const s = normalize(r).replace(/\s+/g, '');
  const lead = s[0];
  if (lead === '+' || lead === '-') {
    if (/[×÷*]/.test(r)) throw new MathErr('One kind of move per step: add/subtract OR multiply/divide. Split this into two steps.');
    const val = eva(parseExpr(s));
    if (Lin.isConst(val) && val.k.isZero()) throw new MathErr('Adding zero does nothing. The crowd is bored.');
    return { type: 'add', val, raw: r };
  }
  if (lead === '*' || lead === '/') {
    const rest = s.slice(1);
    if (!rest) throw new MathErr(`Put a number after the ${lead === '*' ? '×' : '÷'}.`);
    const ast = parseExpr(rest);
    const isCoef = (n) => n.t === 'num' || n.t === 'neg' && isCoef(n.a) || n.t === 'div' && isCoef(n.a) && isCoef(n.b) || n.t === 'grp' && isCoef(n.a);
    if (!isCoef(ast)) {
      const v = (() => { try { return eva(ast); } catch (e) { return null; } })();
      if (v && !Lin.isConst(v)) throw new MathErr('This floor only lets you multiply or divide both sides by a number, not a variable.');
      throw new MathErr(`Just one number after the ${lead === '*' ? '×' : '÷'}. If you need more moves, use more steps.`);
    }
    const v = eva(ast).k;
    if (v.isZero()) throw new MathErr(lead === '*' ? 'Multiplying by zero deletes the whole equation. Nice try.' : "You can't divide by zero. Not even in the dungeon.");
    return { type: 'mul', f: lead === '*' ? v : Q1.div(v), shown: v, lead, raw: r };
  }
  throw new MathErr('Start the move with +, −, ×, or ÷.');
}
function applyOp(lin, op) {
  if (!op) return lin;
  return op.type === 'add' ? Lin.add(lin, op.val) : Lin.scale(lin, op.f);
}
function sameOp(a, b) {
  if (a.type !== b.type) return false;
  return a.type === 'add' ? Lin.eq(a.val, b.val) : a.f.eq(b.f);
}

// ---------- equation state ----------
function makeState(Lraw, Rraw) {
  const Last = parseExpr(Lraw), Rast = parseExpr(Rraw);
  return { Lraw: String(Lraw), Rraw: String(Rraw), Last, Rast, Lv: eva(Last), Rv: eva(Rast) };
}
function solveSet(Lv, Rv) {
  const d = Lin.sub(Lv, Rv); const vs = Lin.vars(d);
  if (!vs.length) return d.k.isZero() ? { kind: 'all' } : { kind: 'none' };
  if (vs.length > 1) return { kind: 'multi' };
  return { kind: 'one', v: vs[0], val: d.k.neg().div(d.v[vs[0]]) };
}
const squash = (s) => normalize(s).replace(/\s+/g, '').toLowerCase();
function simpleNumber(raw) { // -> {ok, lowest}
  const s = squash(raw);
  if (/^-?\d+$/.test(s)) return { ok: true, lowest: true };
  if (/^-?(\d+\.\d*|\.\d+)$/.test(s)) return { ok: true, lowest: true, decimal: true };
  const m = s.match(/^-?(\d+)\/(\d+)$/);
  if (m) { const a = +m[1], b = +m[2]; return { ok: true, lowest: b > 1 && gcd(a, b) === 1 }; }
  return { ok: false };
}

// ---------- mistake diagnosis ----------
const MSG = {
  oneSide: 'You only wrote a move under one side. Whatever you do to the left, you do to the right.',
  mismatch: "Your two moves don't match. Both sides get the exact same move.",
  forgotOp: 'You wrote the move but the {side} side looks like you never applied it.',
  signOp: 'Sign check on the {side} side: it looks like you went the opposite direction of the move you wrote.',
  invertedOp: 'On the {side} side you multiplied when you meant to divide (or the other way around).',
  partialMul: "On the {side} side you only hit part of it. When you multiply or divide a side, every term gets hit.",
  signMul: 'Sign check on the {side} side: multiplying or dividing by a negative flips every sign.',
  firstOnly: 'Distribution miss on the {side} side: the number outside the parentheses multiplies every term inside, not just the first one.',
  signSlip: 'Sign slip on the {side} side: when you distribute a negative, negative × negative = positive.',
  minusFirst: 'On the {side} side, the minus in front of the parentheses flips the sign of every term inside, not just the first.',
  unlike: "On the {side} side you merged unlike terms. {v}-terms and plain numbers can't combine.",
  constOff: 'Your {v}-term on the {side} side is right. Recheck the plain numbers.',
  varOff: 'The plain numbers on the {side} side are right. Recheck the {v}-terms.',
  bothOff: 'The {side} side is off in both the {v}-terms and the numbers. Slow down and redo that side.',
  valueChanged: "With no move written, each side has to stay worth the same thing. The {side} side changed.",
  repeatDec: "That fraction doesn't turn into a clean decimal. Leave it as a fraction.",
};
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');

function diagnoseSide(P, Pv, op, G, E, v, rawG) {
  const eq = (x) => Lin.eq(G, x);
  if (op) {
    if (eq(Pv) && !Lin.eq(Pv, E)) return 'forgotOp';
    if (op.type === 'add' && eq(Lin.sub(Pv, op.val))) return 'signOp';
    if (op.type === 'mul') {
      if (eq(Lin.scale(Pv, Q1.div(op.f)))) return 'invertedOp';
      const vp = Lin.varPart(Pv), cp = Lin.constPart(Pv);
      if (!Lin.isConst(Pv) && !Pv.k.isZero() && (eq(Lin.add(Lin.scale(vp, op.f), cp)) || eq(Lin.add(vp, Lin.scale(cp, op.f))))) return 'partialMul';
      if (eq(Lin.scale(Pv, op.f.neg()))) return 'signMul';
    }
  }
  if (P && hasGrp(P)) {
    for (const mode of ['firstOnly', 'signSlip', 'minusFirst']) {
      try {
        const F = eva(P, mode);
        if (!Lin.eq(F, Pv) && eq(applyOp(F, op))) return mode;
      } catch (e) {}
    }
  }
  if (rawG && /\./.test(rawG) && E.k.d > 1) {
    let d = E.k.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5;
    if (d > 1) return 'repeatDec';
  }
  const a = Lin.coef(E, v), b = E.k;
  if (!a.isZero() && !b.isZero()) {
    const s = a.add(b);
    if (eq(Lin.c(s)) || eq(Lin.x(v, s))) return 'unlike';
  }
  const vpOk = Lin.eq(Lin.varPart(G), Lin.varPart(E));
  const cpOk = G.k.eq(E.k);
  if (vpOk && !cpOk) return 'constOff';
  if (!vpOk && cpOk) return 'varOff';
  return op ? 'bothOff' : 'valueChanged';
}

// ---------- the step checker ----------
// prev: state; input: {opL, opR, resL, resR}; v: variable
function checkStep(prev, input, v) {
  const out = { ok: false };
  let opL, opR;
  try { opL = parseOp(input.opL); } catch (e) { return { kind: 'error', where: 'opL', msg: e.message }; }
  try { opR = parseOp(input.opR); } catch (e) { return { kind: 'error', where: 'opR', msg: e.message }; }
  for (const [op, where] of [[opL, 'opL'], [opR, 'opR']]) {

let screen = null;
function show(name) {
  screen = name;
  for (const s of SCREENS) $(`#scr-${s}`).hidden = s !== name;
  setPad(false);
  window.scrollTo(0, 0);
}

/* ================= keypad ================= */
let activeInput = null;
let padSubmit = null;
let padVar = 'x';
const KEYS = ['7', '8', '9', 'frac', 'back', '4', '5', '6', 'var', '×', '1', '2', '3', '(', '÷', '0', '.', '−', ')', '+', 'left', 'right', 'clear', 'next'];
function buildPad() {
  const g = $('#pad .pad-grid');
  g.innerHTML = KEYS.map((k) => {
    const label = { frac: '<span class="fr"><span class="fn">a</span><span class="fd">b</span></span>', back: '⌫', var: 'x', left: '◀', right: '▶', clear: 'Clear', next: 'Next box' }[k] || k;
    const cls = ['frac', 'back', 'left', 'right', 'clear'].includes(k) ? 'fn' : k === 'var' ? 'var' : ['×', '÷', '+', '−', '(', ')'].includes(k) ? 'opk' : k === 'next' ? 'go' : '';
    const aria = { frac: 'fraction bar', back: 'backspace', var: 'variable', left: 'cursor left', right: 'cursor right', clear: 'clear box', next: 'next box', '−': 'minus', '×': 'times', '÷': 'divide by', '(': 'open parenthesis', ')': 'close parenthesis', '.': 'decimal point' }[k] || k;
    return `<button type="button" class="key ${cls}" data-k="${esc(k)}" aria-label="${esc(aria)}">${label}</button>`;
  }).join('');
  g.addEventListener('pointerdown', (e) => { const b = e.target.closest('.key'); if (!b) return; e.preventDefault(); padPress(b.dataset.k); });
  g.addEventListener('click', (e) => { const b = e.target.closest('.key'); if (!b || e.detail !== 0) return; padPress(b.dataset.k); });
}
function setPad(on, v) {
  $('#pad').hidden = !on;
  if (v) padVar = v;
  const vk = $('#pad .key.var'); if (vk) vk.textContent = padVar;
}
function visibleCells() { return $$(`#scr-${screen} .cell`).filter((c) => c.offsetParent !== null); }
function focusCell(el) {
  if (!el) return;
  activeInput = el;
  $$('.cell.active').forEach((c) => c.classList.remove('active'));
  el.classList.add('active');
  el.focus({ preventScroll: true });
  const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {}
}
function padPress(k) {
  const el = activeInput && document.body.contains(activeInput) ? activeInput : visibleCells()[0];
  if (k === 'next') {
    const cells = visibleCells(); const i = cells.indexOf(el);
    if (i >= 0 && i < cells.length - 1) focusCell(cells[i + 1]);
    else if (padSubmit) padSubmit();
    return;
  }
  if (!el) return;
  if (document.activeElement !== el) focusCell(el);
  let s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? s;
  const v = el.value;
  const ins = (t) => { el.value = v.slice(0, s) + t + v.slice(e); const p = s + t.length; el.setSelectionRange(p, p); };
  if (k === 'back') { if (s !== e) ins(''); else if (s > 0) { el.value = v.slice(0, s - 1) + v.slice(e); el.setSelectionRange(s - 1, s - 1); } }
  else if (k === 'left') { const p = Math.max(0, s - 1); el.setSelectionRange(p, p); }
  else if (k === 'right') { const p = Math.min(v.length, e + 1); el.setSelectionRange(p, p); }
  else if (k === 'clear') { el.value = ''; }
  else if (k === 'frac') ins('/');
  else if (k === 'var') ins(padVar);
  else ins(k);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function wireCells(root, onInput) {
  $$('.cell', root).forEach((c) => {
    c.addEventListener('focus', () => { activeInput = c; $$('.cell.active').forEach((x) => x.classList.remove('active')); c.classList.add('active'); });
    c.addEventListener('input', () => { c.classList.remove('bad'); onInput && onInput(c); });
    c.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); padPress('next'); } });
  });
}
function cellHTML(f, value, placeholder, extra = '') {
  return `<input class="cell ${extra}" data-f="${f}" value="${esc(value || '')}" placeholder="${esc(placeholder)}" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(placeholder)}">`;
}
function previewHTML(el) {
  if (!el || !el.value.trim()) return '<span>Tap a box, then use the keypad. <span class="fr"><span class="fn">a</span><span class="fd">b</span></span> makes a fraction: 3/4x means ¾x.</span>';
  const isOp = el.dataset.f === 'opL' || el.dataset.f === 'opR';
  let ok = true;
  try { if (isOp) E.parseOp(el.value); else E.parseExpr(el.value); } catch (e) { ok = false; }
  if (!ok) return `<span>Still typing…</span>`;
  return `<span>Reads as</span> ${isOp ? opHTML(el.value) : mathHTML(el.value)}`;
}

/* ================= runs ================= */
let run = null;
function startFloor() {
  const core = shuffle(['fraction', 'distribution', ...shuffle(['standard', 'double', 'special']).slice(0, 2)]);
  run = {
    mode: 'floor', time: 15 * 60, idx: 0, hp: 100, shield: false, collapsing: false,
    bossName: pick(TXT.bosses), loot: [], solved: 0, fixed: 0, xp0: save.xp, fans0: save.followers, t0: Date.now(),
    plan: [
      { type: core[0] }, { type: core[1] },
      { type: pick(['fraction', 'distribution', 'double']), side: true, quest: pick(TXT.sideQuests) },
      { type: core[2] }, { type: core[3] },
      { type: 'boss', boss: true },
    ],
  };
  save.stats.runs++; persist();
  show('run');
  enterRoom();
}
function enterRoom() {
  const room = run.plan[run.idx];
  if (room.side && !room.accepted) {
    renderRunShell();
    showModal(`
      <div class="sys"><div class="sys-title">Side quest: ${esc(room.quest.name)}</div><p>${say(room.quest.text)}</p></div>
      <p class="muted">Optional. Side quests drop an extra item.</p>
      <button class="btn primary block" id="sq-yes">Take the side quest</button>
      <button class="btn block" id="sq-no">Skip it</button>`, (c) => {
      $('#sq-yes', c).onclick = () => { room.accepted = true; closeModal(); startProblem(room); };
      $('#sq-no', c).onclick = () => { room.skipped = true; closeModal(); nextRoom(); };
    });
    return;
  }
  startProblem(room);
}
function makeProblem(gen, type, extra = {}) {
  const st = E.makeState(gen.L, gen.R);
  return {
    L: gen.L, R: gen.R, v: gen.v, type, sol: E.solveSet(st.Lv, st.Rv), st, orig: st,
    history: [], mistakes: 0, stepMiss: 0, hintLvl: 0, stepHint: -1, maxHint: -1, hints: [0, 0, 0],
    tutorial: false, afterMistake: false, codes: [], t0: Date.now(), done: false,
    input: { opL: '', opR: '', resL: '', resR: '' }, fb: null, ...extra,
  };
}
function startProblem(room) {
  let gen = room.boss ? E.GEN.boss() : E.GEN[room.type]();
  if (!gen) gen = E.GEN.standard();
  const type = room.boss || room.type === 'special' ? E.classify(gen.L, gen.R) : room.type;
  const p = makeProblem(gen, type);
  if (room.boss) {
    p.boss = true; p.bossMax = Math.max(3, E.solveSteps(gen.L, gen.R, gen.v).length + 1); p.bossHP = p.bossMax;
    p.title = `Boss: ${run.bossName}`; p.intro = say(pick(TXT.bossIntro), { boss: run.bossName });
  } else if (room.side) {
    p.side = true; p.title = `Side quest: ${room.quest.name}`; p.intro = say(room.quest.text);
  } else {
    p.title = TXT.roomNames[room.type]; p.intro = say(pick(TXT.roomIntro[room.type]));
  }
  const [who, line] = pick(TXT.banter); p.banter = [who, say(line)];
  run.problem = p;
  renderRun(true);
}

function renderRunShell() {
  renderHUD();
  $('#run-body').innerHTML = '';
}
function renderHUD() {
  const hp = run.hp;
  const bag = [['potion', 'Potion'], ['potion2', 'Big potion'], ['shield', 'Shield'], ['crystal', '+2 min']]
    .filter(([id]) => (save.inv[id] || 0) > 0 && !(id === 'crystal' && run.mode !== 'floor'))
    .map(([id, label]) => `<button type="button" data-use="${id}">${label} ×${save.inv[id]}</button>`).join('');
  let pips = '';
  if (run.mode === 'floor') {
    pips = run.plan.map((r, i) => {
      const c = ['pip', r.side ? 'side' : '', r.boss ? 'boss' : '', i < run.idx ? (r.skipped ? 'skip' : 'done') : '', i === run.idx ? 'now' : ''].join(' ');
      return `<span class="${c}" title="${r.boss ? 'Boss' : r.side ? 'Side quest' : 'Room'}"></span>`;
    }).join('');
  }
  $('#hud').innerHTML = `
    <div class="hud-in">
      <div class="hud-row">
        <div class="hpwrap">
          <div class="hpnum"><span>HP ${hp}/100${run.shield ? ' · shielded' : ''}</span><span>Lv ${lvl()}</span></div>
          <div class="bar hp ${hp <= 30 ? 'low' : ''}"><i style="width:${hp}%"></i></div>
        </div>
        <div class="fans"><b>${fmtFans(save.followers)}</b>followers</div>
        ${run.mode === 'floor' ? `<div class="timer ${run.time <= 60 ? 'warn' : ''}" id="timer" aria-label="Time until the floor collapses">${clock(run.time)}</div>` : ''}
      </div>
      <div class="hud-row2">
        <div class="pips" aria-label="Room progress">${pips || '<span class="muted small">Homework Hollow</span>'}</div>
        <div class="bag">${bag}<button type="button" class="quit" id="quit">Leave</button></div>
      </div>
    </div>`;
  $$('#hud [data-use]').forEach((b) => (b.onclick = () => useItem(b.dataset.use)));
  $('#quit').onclick = confirmQuit;
}
function useItem(id) {
  const it = ITEMS.find((i) => i.id === id);
  if (!it || !(save.inv[id] > 0)) return;
  if (it.use === 'heal') { if (run.hp >= 100) return toast('HP is already full.'); run.hp = Math.min(100, run.hp + it.amt); }
  if (it.use === 'shield') { if (run.shield) return toast('Shield is already up.'); run.shield = true; }
  if (it.use === 'time') { if (run.mode !== 'floor' || run.collapsing) return toast('Too late for that.'); run.time += it.amt; }
  save.inv[id]--; persist();
  toast(`Used ${esc(it.name)}`);
  renderHUD();
}
function confirmQuit() {
  showModal(`
    <h2>Leave ${run.mode === 'floor' ? 'the floor' : 'this fight'}?</h2>
    <p class="muted" style="margin-top:6px">You keep the loot and XP you already earned.</p>
    <button class="btn primary block" id="q-stay">Keep fighting</button>
    <button class="btn block" id="q-go">Leave</button>`, (c) => {
    $('#q-stay', c).onclick = closeModal;
    $('#q-go', c).onclick = () => { closeModal(); endRun(run.mode === 'hw' ? 'quitHw' : 'quit'); };
  });
}

function renderRun(fresh = false) {
  if (screen !== 'run') show('run');
  renderHUD();
  const p = run.problem;
  const keepField = !fresh && activeInput ? activeInput.dataset.f : null;
  const body = $('#run-body');
  let html = '';
  if (run.collapsing) html += `<div class="sys alert"><div class="sys-title">Floor collapse</div><p>${say(TXT.collapseWarn)}</p></div>`;
  html += `<div class="sys"><div class="sys-title">${esc(p.title)}</div><p>${p.intro}</p></div>`;
  html += `<div class="say"><b>${esc(p.banter[0])}</b><span>${p.banter[1]}</span></div>`;
  if (p.boss) html += `<div class="boss-bar" id="bossbar"><div class="stat-line"><span>${esc(run.bossName)}</span><span>${p.bossHP}/${p.bossMax}</span></div><div class="bar"><i style="width:${(p.bossHP / p.bossMax) * 100}%"></i></div></div>`;
  html += `<div class="board" id="board">${eqRow(p.L, p.R, 'start')}`;
  p.history.forEach((h, i) => {
    html += opRow(h.opL, h.opR);
    html += eqRow(h.L, h.R, p.done && i === p.history.length - 1 && !p.declared ? 'final' : '');
  });
  if (!p.done) {
    html += `<div class="entry">
      <div class="row">${'<div class="l">' + cellHTML('opL', p.input.opL, 'move (or blank)', 'op') + '</div>'}<div class="mid"></div><div class="r">${cellHTML('opR', p.input.opR, 'move (or blank)', 'op')}</div></div>
      <div class="row"><div class="l">${cellHTML('resL', p.input.resL, 'left side')}</div><div class="mid"><b>=</b></div><div class="r">${cellHTML('resR', p.input.resR, 'right side')}</div></div>
    </div>`;
  }
  if (p.declared) html += `<div class="row eqrow final"><div class="l" style="grid-column:1/-1;text-align:center">${p.declared === 'all' ? 'All real numbers' : 'No solution'}</div></div>`;
  html += `</div>`;
  if (!p.done) {
    html += `<div class="preview" id="preview"></div>`;
    html += `<div class="fb ${p.fb ? p.fb.cls : ''}" id="fb" aria-live="polite">${p.fb ? p.fb.html : ''}</div>`;
    html += `<div class="actions"><button class="btn primary" id="check">Check move</button><button class="btn" id="hint">Hint ${Math.min(p.hintLvl + 1, 3)} of 3</button></div>`;
    html += `<div class="declare"><button class="btn ghost" id="d-none">No solution</button><button class="btn ghost" id="d-all">All real numbers</button></div>`;
  } else {
    html += victoryHTML(p);
  }
  body.innerHTML = html;

  if (!p.done) {
    const entry = $('.entry', body);
    wireCells(entry, (c) => { p.input[c.dataset.f] = c.value; $('#preview').innerHTML = previewHTML(c); });
    $$('.cell', entry).forEach((c) => c.addEventListener('focus', () => ($('#preview').innerHTML = previewHTML(c))));
    $('#check').onclick = doCheck;
    $('#hint').onclick = doHint;
    $('#d-none').onclick = () => doDeclare('none');
    $('#d-all').onclick = () => doDeclare('all');
    padSubmit = doCheck;
    setPad(true, p.v);
    const target = (keepField && $(`.cell[data-f="${keepField}"]`, entry)) || (fresh || p.focusFirst ? $('.cell[data-f="opL"]', entry) : null);
    p.focusFirst = false;
    if (target) focusCell(target);
    $('#preview').innerHTML = previewHTML(activeInput && document.body.contains(activeInput) ? activeInput : null);
    if (p.bad) { const b = $(`.cell[data-f="${p.bad}"]`, entry); if (b) b.classList.add('bad'); p.bad = null; }
  } else {
    wireVictory(p, body);
  }
  if (fresh) window.scrollTo(0, 0);
  else if (!p.done) { const fb = $('#fb'); if (fb && p.fb) { const d = $('.declare', body); (d || fb).scrollIntoView({ block: 'nearest' }); } }
}

function readInputs() { return { ...run.problem.input }; }
function doCheck() {
  const p = run.problem; if (p.done) return;
  const inp = readInputs();
  const r = E.checkStep(p.st, inp, p.v);
  if (r.kind === 'error') { p.bad = r.where; p.fb = { cls: 'info', html: `<p>${esc(r.msg)}</p>` }; }
  else if (r.kind === 'stall') p.fb = { cls: 'info', html: `<p>${say(TXT.stall)}</p>` };
  else if (r.kind === 'mistake') { p.bad = r.where; onMistake(r.code, r.msg, r); }
  else if (r.kind === 'ok') onGood(r, inp);
  if (!p.done) renderRun();
}
function onMistake(code, msg, extra = {}) {
  const p = run.problem;
  p.mistakes++; p.stepMiss++; p.codes.push(code); p.afterMistake = true;
  save.stats.mistakes++; save.stats.codes[code] = (save.stats.codes[code] || 0) + 1;
  const lost = ri(5, 30) * lvl(); gainFans(-lost);
  let dmg = p.boss ? 20 : 15, line;
  if (run.shield) { run.shield = false; dmg = 0; line = TXT.shielded; }
  else { run.hp = Math.max(0, run.hp - dmg); line = pick(TXT.bad); }
  const notes = [];
  if (extra.combo) notes.push(TXT.split);
  if (extra.fracs) notes.push(TXT.fracTip);
  p.fb = { cls: 'bad', html: `<p><span class="who">The System:</span> ${say(line, { dmg, fans: fmtFans(lost) })}</p><p>${esc(msg)}</p>${notes.map((n) => `<p class="small">${esc(n)}</p>`).join('')}` };
  persist();
  if (run.hp <= 0 || p.stepMiss >= 3) setTimeout(intervention, 650);
}
function onGood(r, inp) {
  const p = run.problem;
  p.history.push({ opL: inp.opL, opR: inp.opR, L: inp.resL, R: inp.resR });
  p.st = r.next; p.stepMiss = 0; p.hintLvl = 0;
  const f = r.flags;
  if (f.wroteOp) award('bothsides');
  if (f.cleared) award('denom');
  if (f.distributed) award('bracket');
  if (f.combo) award('combo');
  if (f.decimal) award('decimal');
  if (f.swapped) award('mirror');
  if (p.afterMistake) { if (p.stepHint < 2) { award('selffix'); run.fixed = (run.fixed || 0) + 1; } p.afterMistake = false; }
  p.stepHint = -1;
  p.input = { opL: '', opR: '', resL: '', resR: '' };
  gainXP(5);
  const gained = ri(20, 80) * lvl(); gainFans(gained);
  if (p.boss) {
    p.bossHP = Math.max(r.status === 'solved' ? 0 : 1, p.bossHP - 1);
    setTimeout(() => { const b = $('#bossbar'); if (b) b.classList.add('shake'); }, 30);
  }
  activeInput = null; p.focusFirst = true;
  if (r.status === 'solved') { solve({}); return; }
  if (r.status === 'simplify') p.fb = { cls: 'info', html: `<p>Almost. The ${p.v} is alone, but the number side isn't in simplest form yet. Reduce it and write it again with the move boxes empty.</p>` };
  else if (r.status === 'declare') p.fb = { cls: 'info', html: `<p>The ${p.v}'s are gone. Is what's left true or false? Tap <b>No solution</b> or <b>All real numbers</b>.</p>` };
  else {

}
function doHint() {
  const p = run.problem; if (p.done) return;
  const lv = Math.min(p.hintLvl, 2);
  const m = E.nextMove(p.st, p.v);
  const text = E.hintText(m, lv, p.v);
  const [who, pre] = TXT.hintVoices[lv];
  p.hints[lv]++; save.stats.hints[lv]++;
  p.stepHint = Math.max(p.stepHint, lv); p.maxHint = Math.max(p.maxHint, lv);
  p.hintLvl = Math.min(p.hintLvl + 1, 2);
  award('directions');
  p.fb = { cls: 'hint', html: `<p><span class="who">${esc(who)}:</span> ${esc(pre + text)}</p>` };
  persist();
  renderRun();
}
function doDeclare(kind) {
  const p = run.problem; if (p.done) return;
  const actual = E.solveSet(p.st.Lv, p.st.Rv).kind;
  if (actual === kind) {
    const early = !(E.Lin.isConst(p.st.Lv) && E.Lin.isConst(p.st.Rv));
    p.declared = kind;
    award(kind);
    if (early) award('early');
    solve({ declare: kind, early });
  } else {
    onMistake('declareWrong', "That call doesn't match this equation. Keep working it and see what's left.");
    renderRun();
  }
}
function solve(x) {
  const p = run.problem;
  p.done = true; p.secs = Math.round((Date.now() - p.t0) / 1000);
  run.solved++;
  const S = save.stats;
  S.solved++;
  if (p.mistakes === 0) { S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); } else S.streak = 0;
  const clean = p.mistakes === 0 && p.maxHint < 2;
  if (clean) { S.clean++; award('flawless'); }
  award('first');
  if (S.streak >= 5) award('streak5');
  if (S.streak >= 10) award('streak10');
  if (run.mode === 'hw') award('homework');
  if (p.boss) { award('boss'); S.bosses++; p.bossHP = 0; }
  const bt = S.byType[p.type] || (S.byType[p.type] = { solved: 0, mistakes: 0, hints: 0 });
  bt.solved++; bt.mistakes += p.mistakes; bt.hints += p.hints[0] + p.hints[1] + p.hints[2];
  logProblem(p, 'solved');
  const xp = 25 + (clean ? 15 : 0) + (p.boss ? 60 : 0);
  gainXP(xp);
  const fans = ri(100, 300) * lvl() * (p.boss ? 3 : 1);
  gainFans(fans);
  let text = x.declare ? TXT.declareRight[x.declare] + (x.early ? ' ' + TXT.early : '') : pick(TXT.solved);
  p.victory = { text: say(text), xp, fans };
  p.verify = p.sol.kind === 'one' ? { state: 'ask', L: '', R: '', msg: '' } : null;

  persist();
  renderRun();
}

}
function victoryHTML(p) {

function checkVerify() {

/* ================= loot ================= */
const TIERS = ['bronze', 'silver', 'gold', 'legendary'];
const TIER_NAMES = { bronze: 'Bronze Box', silver: 'Silver Box', gold: 'Gold Box', legendary: 'Legendary Box' };
function rollItem(tier) {
  const pool = ITEMS.filter((i) => i.tier === tier);
  const cons = pool.filter((i) => i.use), coll = pool.filter((i) => !i.use);
  return cons.length && Math.random() < 0.35 ? pick(cons) : pick(coll.length ? coll : pool);
}
function openLoot(p) {
  let pts = 0;
  if (p.mistakes === 0) pts++;
  if (p.maxHint < 2) pts++;
  if ((p.verify && p.verify.state === 'good') || p.declared) pts++;
  let ti = pts >= 3 ? 2 : pts === 2 ? 1 : 0;
  if (p.boss) ti++;
  const tier = TIERS[Math.min(ti, 3)];
  const items = [rollItem(tier)];
  if (p.side) items.push(rollItem(tier));
  if (Math.random() < 0.25) items.push(rollItem('bronze'));
  const isLast = run.mode === 'hw' || run.idx >= run.plan.length - 1 || run.collapsing;
  showModal(`
    <h2 style="text-align:center">${esc(TIER_NAMES[tier])}</h2>
    <p class="muted small" style="text-align:center;margin-top:4px">${reasonText(p)}</p>
    <button type="button" class="loot-box closed t-${tier}" id="box" aria-label="Open the box">Tap to open</button>
    <div id="loot-items"></div>
    <button class="btn primary block" id="loot-next" hidden>${isLast ? (run.mode === 'hw' ? 'Back to the safe room' : 'Head for the stairs') : 'Next room'}</button>`, (c) => {
    const box = $('#box', c);
    box.onclick = () => {
      if (!box.classList.contains('closed')) return;
      box.classList.remove('closed'); box.classList.add('pop'); box.textContent = 'Opened';
      for (const it of items) { save.inv[it.id] = (save.inv[it.id] || 0) + 1; run.loot.push(it.id); }
      if (ITEMS.filter((i) => !i.use && save.inv[i.id] !== undefined).length >= 10) award('hoarder');
      persist();
      $('#loot-items', c).innerHTML = items.map((it) => `<div class="item"><div class="tier t-${it.tier}">${esc(it.tier[0].toUpperCase() + it.tier.slice(1))}${it.use ? ' · usable' : ''}</div><h3>${esc(it.name)}</h3><div class="muted small">${sw(esc(it.desc))}</div></div>`).join('');
      const nx = $('#loot-next', c); nx.hidden = false; nx.focus({ preventScroll: true });
    };
    $('#loot-next', c).onclick = nextRoom;
  });
}
function reasonText(p) {
  const bits = [];
  bits.push(p.mistakes === 0 ? 'no mistakes' : `${p.mistakes} mistake${p.mistakes > 1 ? 's' : ''}`);
  bits.push(p.maxHint < 2 ? 'no big hints' : 'used the big hint');
  if (p.verify) bits.push(p.verify.state === 'good' ? 'answer checked' : 'answer not checked');
  if (p.boss) bits.push('boss bonus');
  if (p.side) bits.push('side quest bonus item');

}
function nextRoom() {
  closeModal();
  if (run.mode === 'hw') return endRun('homework');
  if (run.collapsing) return endRun('collapse');
  run.idx++;
  if (run.idx >= run.plan.length) return endRun('cleared');

/* ================= intervention ================= */
function intervention() {
  const p = run.problem; if (!p || p.done) return;
  p.tutorial = true; save.stats.tutorials++; persist();
  let ex = p.type === 'special' ? E.GEN.special(false) : (E.GEN[p.type] || E.GEN.standard)();
  if (!ex) ex = E.GEN.standard();
  const steps = E.solveSteps(ex.L, ex.R, ex.v);
  let shown = 0;
  showModal(`
    <div class="sys alert"><div class="sys-title">System intervention</div><p>${say(pick(TXT.intervention))}</p></div>
    <p>${esc(TXT.interventionSub)}</p>
    <div class="worked" id="worked"></div>
    <button class="btn primary block" id="w-next">Show the next move</button>`, (c) => {
    const draw = () => {
      let h = `<div class="board">${eqRow(ex.L, ex.R, 'start')}`;
      for (let i = 0; i < shown; i++) {
        const s = steps[i];
        h += `<div class="why">${i + 1}. ${esc(s.why)}</div>`;
        if (s.declare) h += `<div class="row eqrow final"><div class="l" style="grid-column:1/-1;text-align:center">${s.declare === 'all' ? 'All real numbers' : 'No solution'}</div></div>`;
        else { h += opRow(s.op || '', s.op || ''); h += eqRow(s.L, s.R, i === steps.length - 1 ? 'final' : ''); }
      }
      h += '</div>';
      $('#worked', c).innerHTML = h;
      const btn = $('#w-next', c);
      if (shown >= steps.length) { btn.textContent = 'Back to the fight'; }
    };
    draw();
    $('#w-next', c).onclick = () => {
      if (shown < steps.length) { shown++; draw(); $('#w-next', c).scrollIntoView({ block: 'nearest' }); return; }
      run.hp = 100; p.stepMiss = 0;
      p.input = { opL: '', opR: '', resL: '', resR: '' }; p.focusFirst = true; activeInput = null;
      award('tutorial');
      p.fb = { cls: 'info', html: `<p><span class="who">The System:</span> ${say(TXT.interventionEnd)}</p>` };
      closeModal(); renderRun();
    };
  });
}

      <div><b>${S.verifies}</b><span>answers checked by plugging back in</span></div>
    </div>
    <div class="section"><h2>By problem type</h2>
      ${types.length ? `<div class="tbl-wrap"><table><thead><tr><th>Type</th><th class="num">Solved</th><th class="num">Mistakes per problem</th><th class="num">Hints per problem</th></tr></thead><tbody>
      ${types.map((t) => { const b = S.byType[t]; return `<tr><td>${esc(TYPE_LABELS[t])}</td><td class="num">${b.solved}</td><td class="num">${(b.mistakes / b.solved).toFixed(1)}</td><td class="num">${(b.hints / b.solved).toFixed(1)}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="muted">No problems solved yet.</p>'}
    </div>
    <div class="section"><h2>Most common mistakes</h2>
      ${codes.length ? `<div class="tbl-wrap"><table><tbody>${codes.map(([c, n]) => `<tr><td>${esc(CODE_LABELS[c] || c)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">None recorded yet.</p>'}
    </div>
    <div class="section"><h2>Recent problems</h2>
      ${save.log.length ? save.log.slice(0, 20).map((l) => {
        const hints = l.hints[0] + l.hints[1] + l.hints[2];
        const meta = [
          new Date(l.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
          l.mode === 'hw' ? 'homework' : TYPE_LABELS[l.type] || l.type,
          l.result === 'solved' ? `solved in ${clock(l.secs)}` : 'left unfinished',
          `${l.mistakes} mistake${l.mistakes === 1 ? '' : 's'}`,
          `${hints} hint${hints === 1 ? '' : 's'}`,
        ];
        if (l.tut) meta.push('needed an intervention');
        const what = (l.codes || []).map((c) => CODE_LABELS[c]).filter(Boolean);
        return `<div class="logrow"><div class="logeq">${mathHTML(l.L)}<span class="bin">=</span>${mathHTML(l.R)}</div><div class="muted small">${esc(meta.join(', '))}</div>${what.length ? `<div class="small" style="color:var(--rose)">${esc([...new Set(what)].join('; '))}</div>` : ''}</div>`;
      }).join('') : '<p class="muted">Nothing yet.</p>'}
    </div>
    <div class="section"><h2>Settings</h2>
      <label class="toggle"><span>Bleep the swearing<br><span class="muted small">Book-level language is on by default.</span></span><input type="checkbox" id="set-bleep" ${save.settings.bleep ? 'checked' : ''}></label>
      <label class="toggle"><span>Theme</span><select id="set-theme" class="text-in" style="width:auto;min-height:40px">${['auto', 'dark', 'light'].map((t) => `<option value="${t}" ${save.settings.theme === t ? 'selected' : ''}>${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}</select></label>
      <div class="toggle"><span>Change PIN</span><button class="btn" id="set-pin">Change</button></div>
    </div>
    <div class="section"><h2>Backup</h2>
      <p class="muted small">Progress is saved on this device. Copy the save code to keep a backup or move it to another device.</p>
      <textarea class="text-in" id="save-code" readonly></textarea>
      <div class="actions"><button class="btn" id="copy-code">Copy save code</button><button class="btn" id="restore">Restore from code</button></div>
    </div>
    <div class="section"><h2>Start over</h2>
      <p class="muted small">Erases the crawler, loot, achievements, and stats on this device.</p>
      <button class="btn block" id="reset" style="border-color:var(--rose);color:var(--rose)">Reset all progress</button>
    </div>
    <button class="btn primary block" id="p-done" style="margin-top:20px">Lock and go back</button>`;
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
  $('#save-code').value = code;
  $('#set-bleep').onchange = (e) => { save.settings.bleep = e.target.checked; persist(); };
  $('#set-theme').onchange = (e) => { save.settings.theme = e.target.value; persist(); applyTheme(); };
  $('#set-pin').onclick = () => { save.settings.pin = null; persist(); renderParent(false); };
  $('#copy-code').onclick = async () => {
    try { await navigator.clipboard.writeText(code); toast('Save code copied'); }
    catch (e) { const t = $('#save-code'); t.focus(); t.select(); toast('Select all and copy the code'); }
  };
  $('#restore').onclick = () => showModal(`
    <h2>Restore from code</h2>
    <p class="muted" style="margin-top:6px">This replaces everything on this device.</p>
    <textarea class="text-in" id="r-code" placeholder="Paste the save code"></textarea>
    <div class="fb" id="r-msg"></div>
    <button class="btn primary block" id="r-go" style="margin-top:10px">Restore</button>
    <button class="btn block" id="r-cancel">Cancel</button>`, (c) => {
    $('#r-cancel', c).onclick = closeModal;
    $('#r-go', c).onclick = () => {
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob($('#r-code', c).value.trim()))));
        if (!data || data.v !== 1) throw new Error();
        save = merge(freshSave(), data); persist(); applyTheme(); closeModal(); toast('Save restored'); renderParent(true);
      } catch (e) { $('#r-msg', c).className = 'fb bad'; $('#r-msg', c).textContent = "That code didn't work. Check that the whole code was pasted."; }
    };
  });
  $('#reset').onclick = () => showModal(`
    <h2>Reset all progress?</h2>
    <p class="muted" style="margin-top:6px">This can't be undone unless you saved a backup code.</p>
    <button class="btn block" id="x-go" style="border-color:var(--rose);color:var(--rose)">Reset everything</button>
    <button class="btn primary block" id="x-no">Keep progress</button>`, (c) => {
    $('#x-no', c).onclick = closeModal;
    $('#x-go', c).onclick = () => { save = freshSave(); persist(); applyTheme(); closeModal(); renderCreate(); };
  });
  $('#p-done').onclick = renderHub;
}


/* ================= boot ================= */
function boot() {
  applyTheme();
  buildPad();
  if (!save.crawler) renderCreate(); else renderHub();
}
boot();
})();

</script>
</body>
</html>
